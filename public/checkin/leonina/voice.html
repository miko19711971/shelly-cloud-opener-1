<style>
:root{--bg:#2b211b;--paper:#efe3d1;--paper2:#d8c2a1;--ink:#241b15;--muted:#4f4036;--gold:#b8925a;--gold-dark:#8f6d3e;--brown:#3a2a20;--deep:#1f1a17;--line:rgba(184,146,90,.34);--shadow:0 28px 80px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(184,146,90,.25),transparent 28rem),radial-gradient(circle at bottom right,rgba(255,253,248,.10),transparent 30rem),linear-gradient(180deg,#2b211b 0%,#3a2a20 42%,#241b15 100%);min-height:100vh;min-height:100dvh;line-height:1.45;overflow-x:hidden}
.app{width:min(520px,100%);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;color:rgba(255,255,255,.82)}
.brand{letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:800}
.lang-row{display:flex;gap:4px;flex-wrap:nowrap;flex-shrink:0}
.lang-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:white;border-radius:999px;padding:6px 10px;font-weight:800;font-size:11px;cursor:pointer;backdrop-filter:blur(14px);-webkit-tap-highlight-color:transparent}
.lang-btn.active{background:white;color:var(--brown);border-color:white}
.progress-bar{display:flex;gap:4px;padding:0 18px 12px}
.progress-dot{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .4s}
.progress-dot.done{background:var(--gold)}.progress-dot.active{background:white}
.step-card{flex:1;display:flex;flex-direction:column;margin:0 12px 12px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#efe3d1,#d8c2a1);border:1px solid var(--line);box-shadow:var(--shadow);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.step-photo{position:relative;width:100%;aspect-ratio:4/3;background:#12100e;overflow:hidden;flex-shrink:0}
.step-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.96) contrast(1.03) brightness(1.04)}
.step-photo.contain img{object-fit:contain;background:#12100e}
.step-badge{position:absolute;top:14px;left:14px;background:rgba(31,26,23,.72);color:white;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:900;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);letter-spacing:.06em}
.step-body{flex:1;display:flex;flex-direction:column;padding:22px 20px 18px}
.step-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,5vw,32px);line-height:1.05;letter-spacing:-.03em;margin-bottom:10px}
.step-desc{color:var(--muted);font-size:16px;margin-bottom:16px;flex:1}
.step-note{border-left:4px solid var(--gold);background:rgba(58,42,32,.10);padding:12px 14px;border-radius:0 14px 14px 0;color:var(--brown);font-weight:800;font-size:15px;margin-bottom:16px}
.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-yes,.btn-no,.btn-next,.btn-start{flex:1;border:0;border-radius:18px;padding:16px 10px;font-size:17px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.btn-yes:active,.btn-no:active,.btn-next:active,.btn-start:active{transform:scale(.96)}
.btn-yes{background:linear-gradient(135deg,var(--brown),var(--deep));color:white;box-shadow:0 12px 28px rgba(31,26,23,.22)}
.btn-no{background:#f4eadb;color:var(--brown);border:1px solid var(--line)}
.btn-next{background:linear-gradient(135deg,var(--brown),var(--deep));color:white;box-shadow:0 12px 28px rgba(31,26,23,.22)}
.btn-start{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:white;box-shadow:0 14px 34px rgba(184,146,90,.3);font-size:19px;padding:20px;border-radius:22px}
.open-btn{border:0;cursor:pointer;border-radius:18px;padding:16px 22px;min-height:58px;background:linear-gradient(135deg,#3a2a20,#1f1a17);color:white;font-size:16px;font-weight:950;box-shadow:0 18px 34px rgba(31,26,23,.25);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.open-btn:active{transform:scale(.97)}
.status{font-size:14px;color:var(--muted);font-weight:800;min-height:1.2em;text-align:center;margin-top:8px}
@keyframes ncSlowBlink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(0,0,0,.07)}}
.open-btn.nc-blink{animation:ncSlowBlink 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.open-btn.nc-blink{animation:none}}
.toolbar{display:flex;gap:6px;padding:6px 12px 14px;justify-content:center;flex-shrink:0}
.toolbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.88);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;backdrop-filter:blur(14px);-webkit-tap-highlight-color:transparent;transition:background .15s;white-space:nowrap}
.toolbar button:active{background:rgba(255,255,255,.22)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(31,26,23,.85);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
.overlay-sheet{width:min(520px,100%);background:linear-gradient(135deg,#efe3d1,#d8c2a1);border-radius:28px 28px 0 0;padding:24px 20px 32px;max-height:80vh;overflow-y:auto}
.overlay-title{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin-bottom:16px;letter-spacing:-.02em}
.problem-btn{display:block;width:100%;text-align:left;background:rgba(58,42,32,.08);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;font-size:16px;font-weight:700;color:var(--brown);cursor:pointer;-webkit-tap-highlight-color:transparent}
.problem-btn:active{background:rgba(58,42,32,.16)}
.close-overlay{margin-top:8px;width:100%;background:var(--brown);color:white;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:900;cursor:pointer}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 24px;color:white}
.welcome-icon{font-size:48px;margin-bottom:18px}
.welcome h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,42px);line-height:1.05;letter-spacing:-.04em;margin-bottom:12px}
.welcome .subtitle{font-size:17px;color:rgba(255,255,255,.82);max-width:380px;margin-bottom:32px}
.welcome .addr-detail{display:inline-flex;gap:12px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:14px;margin-bottom:28px;backdrop-filter:blur(12px)}
.final{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 24px;color:white}
.final-icon{font-size:56px;margin-bottom:18px}
.final h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,42px);line-height:1.05;letter-spacing:-.03em;margin-bottom:12px}
.final p{font-size:16px;color:rgba(255,255,255,.78);max-width:380px}
.hidden{display:none!important}
.no-help{background:rgba(58,42,32,.08);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.no-help p{color:var(--muted);font-size:15px;margin:0}
</style>
</head>

<div class="app" id="app">
  <div class="top-bar">
    <div class="brand">niceflatinrome.com</div>

  <div class="progress-bar" id="progressBar"></div>
  <div id="content"></div>
  <div class="toolbar" id="toolbar">

    <button id="btnProblem" onclick="showProblems()">&#x2753; <span data-t="problem">Problem</span></button>
    <button onclick="window.open('tel:+393355245756')">&#x1f4de; Michele</button>
  </div>
</div>
<div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="overlay-sheet" id="overlaySheet"></div>
</div>

const STEPS = [
  { id:'s1', img:'building-door.jpg',     contain:true,  type:'open', which:'building',  btnKey:'btn_building',  statusId:'statusBuilding' },
  { id:'s2', img:'elevator-corridor.jpg', contain:true,  type:'confirm' },
  { id:'s3', img:'apartment-door.jpg',    contain:true,  type:'open', which:'apartment', btnKey:'btn_apartment', statusId:'statusApartment' }
];

let lang='en', step=-1, lastSpokenText='';
const TOKEN=new URLSearchParams(location.search).get('t')||'';
function t(key){ return (I18N[lang]||I18N.en)[key]||(I18N.en)[key]||key; }

/* ── TTS ── */
const VOICE_PREFS={en:['Samantha','Google US English','Google UK English Female','Microsoft Aria Online (Natural)'],it:['Alice','Eloisa','Google italiano','Microsoft Elsa Online (Natural)','Microsoft Isabella Online (Natural)'],fr:['Amelie','Thomas','Google fran\u00e7ais','Microsoft Denise Online (Natural)','Microsoft Vivienne Online (Natural)'],de:['Anna','Markus','Google Deutsch','Microsoft Katja Online (Natural)','Microsoft Conrad Online (Natural)'],es:['Monica','Jorge','Paulina','Google espa\u00f1ol','Microsoft Alvaro Online (Natural)']};
let pick=null;
function selectVoice(){if(!('speechSynthesis' in window))return null;const all=speechSynthesis.getVoices()||[];const prefs=VOICE_PREFS[lang]||[];for(const name of prefs){const v=all.find(v=>(v.name||'').toLowerCase()===name.toLowerCase());if(v)return v;}const byLang=all.find(v=>(v.lang||'').toLowerCase().startsWith(lang));return byLang||all[0]||null;}
function refreshVoice(){pick=selectVoice();}
if('speechSynthesis' in window){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;}
function warm(){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const dot=new SpeechSynthesisUtterance('.');dot.volume=0.01;if(pick)dot.voice=pick;dot.lang=pick?.lang||lang;speechSynthesis.speak(dot);}catch{}}
function speak(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();lastSpokenText=text;const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));if(pick)u.voice=pick;u.lang=pick?.lang||lang;speechSynthesis.speak(u);}catch{}}
function repeatAudio(){if(lastSpokenText)speak(lastSpokenText);}

/* ── RENDERING ── */
const $content=document.getElementById('content'),$progress=document.getElementById('progressBar'),$toolbar=document.getElementById('toolbar');
function renderProgress(){let h='';for(let i=0;i<STEPS.length;i++){const c=i<step?'done':i===step?'active':'';h+=`<div class="progress-dot ${c}"></div>`;}$progress.innerHTML=h;$progress.classList.toggle('hidden',step<0);}
function renderWelcome(){$toolbar.classList.add('hidden');$content.innerHTML=`<div class="welcome"><div class="welcome-icon">\ud83c\udfe0</div><h1>${t('welcomeTitle').replace(/\n/g,'<br>')}</h1><div class="addr-detail"><span>\ud83d\udccd ${t('addrInfo')}</span></div><p class="subtitle">${t('welcomeSub')}</p><button class="btn-start" onclick="warm();nextStep()">${t('start')} \u2192</button></div>`;speak(t('welcomeSub'));}
function renderStep(idx){
  const s=STEPS[idx],containCls=s.contain?'contain':'';let buttonsHTML='',extraHTML='';
  if(s.type==='confirm'){
    const askKey=s.id+'_ask',askText=t(askKey);
    if(askText&&askText!==askKey)extraHTML=`<p class="step-desc" style="font-weight:800;color:var(--brown)">${askText}</p>`;
    buttonsHTML=`<div class="btn-row"><button class="btn-yes" onclick="nextStep()">${t('yes')} \u2192</button><button class="btn-no" onclick="showNoHelp(${idx})">${t('no')}</button></div><div id="noHelp" class="no-help hidden"></div>`;
  } else if(s.type==='open'){
    buttonsHTML=`<button class="open-btn" id="btn_open_${idx}" onclick="openWith('${s.statusId}','${s.which}');return false;">${t(s.btnKey)} \u2192</button><div class="status" id="${s.statusId}"></div><div style="height:10px"></div><button class="btn-next" onclick="nextStep()">${t('done')} \u2192</button>`;
  }
  const noteKey=s.id+'_note',noteText=t(noteKey);
  const noteHTML=(noteText&&noteText!==noteKey)?`<div class="step-note">${noteText}</div>`:'';
  $content.innerHTML=`<div class="step-card"><div class="step-photo ${containCls}"><img src="${s.img}" alt=""><div class="step-badge">${t(s.id+'_badge')}</div></div><div class="step-body"><h2 class="step-title">${t(s.id+'_title')}</h2><p class="step-desc">${t(s.id+'_desc')}</p>${noteHTML}${extraHTML}${buttonsHTML}</div></div>`;
  $toolbar.classList.remove('hidden');speak(t(s.id+'_voice'));blinkCheck();
}
function renderFinal(){$toolbar.classList.add('hidden');$content.innerHTML=`<div class="final"><div class="final-icon">\u2728</div><h2>${t('finalTitle')}</h2><p>${t('finalText')}</p></div>`;speak(t('finalVoice'));}
function showNoHelp(idx){const s=STEPS[idx],noKey=s.id+'_no',noText=t(noKey);if(!noText||noText===noKey)return;const el=document.getElementById('noHelp');if(el){el.classList.remove('hidden');el.innerHTML=`<p>${noText}</p>`;speak(noText);}}
function nextStep(){step++;if(step>=STEPS.length){renderProgress();renderFinal();}else{renderProgress();renderStep(step);}}

/* ── OPENING (leonina endpoint) ── */
async function openWith(statusId,which){
  const s=document.getElementById(statusId);if(!s)return;
  if(!TOKEN){s.textContent=t('missingToken');return;}
  s.textContent=t('opening');
  const tries=(which==='building')?['building']:['apartment','door'];
  try{for(const kind of tries){const r=await fetch(`/checkin/leonina/open-direct/${kind}?t=${encodeURIComponent(TOKEN)}`,{method:'POST',cache:'no-store'});if(r.status===404)continue;const j=await r.json().catch(()=>({}));if(r.ok&&j.ok){s.textContent=t('opened');speak(t('opened'));}else{s.textContent=(j.error||j.message)?String(j.error||j.message):`${t('errGeneric')} (${r.status})`;}return;}s.textContent=`${t('errGeneric')} (endpoint not found)`;
  }catch(e){s.textContent=t('netErr');}
}

/* ── BLINK ── */
function blinkCheck(){const m=location.pathname.match(/\/checkin\/([^\/]+)\//);const apt=m&&m[1];if(!apt||!TOKEN)return;fetch('/checkin/'+apt+'/phase?t='+encodeURIComponent(TOKEN),{cache:'no-store'}).then(r=>r.json()).then(j=>{document.querySelectorAll('.open-btn').forEach(b=>b.classList.toggle('nc-blink',!!(j&&j.phase===3)));}).catch(()=>{});}

/* ── PROBLEMS ── */
function showProblems(){if(step<0||step>=STEPS.length)return;const s=STEPS[step],problems=t(s.id+'_problems')||[];const $o=document.getElementById('overlay'),$sh=document.getElementById('overlaySheet');let h=`<h3 class="overlay-title">${t('problemTitle')}</h3>`;problems.forEach((p,i)=>{if(i===problems.length-1)h+=`<button class="problem-btn" onclick="window.open('https://wa.me/393355245756')">\ud83d\udcde ${p}</button>`;else h+=`<button class="problem-btn" onclick="speakProblem(${step});closeOverlay()">\u26a0\ufe0f ${p}</button>`;});h+=`<button class="close-overlay" onclick="closeOverlay()">${t('problemClose')}</button>`;$sh.innerHTML=h;$o.classList.remove('hidden');}
function speakProblem(stepIdx){const s=STEPS[stepIdx],noKey=s.id+'_no',noText=t(noKey);if(noText&&noText!==noKey){speak(noText);const el=document.getElementById('noHelp');if(el){el.classList.remove('hidden');el.innerHTML=`<p>${noText}</p>`;}}}
function closeOverlay(){document.getElementById('overlay').classList.add('hidden');}

/* ── LANGUAGE ── */
function setLang(newLang){lang=I18N[newLang]?newLang:'en';document.documentElement.lang=lang;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));refreshVoice();document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.getAttribute('data-t'));});if(step<0)renderWelcome();else if(step>=STEPS.length)renderFinal();else renderStep(step);}
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));

/* ── INIT ── */
(function(){const params=new URLSearchParams(location.search);const paramLang=params.get('lang');if(paramLang&&I18N[paramLang.toLowerCase()])lang=paramLang.toLowerCase();else{const bl=(navigator.language||'en').slice(0,2).toLowerCase();lang=I18N[bl]?bl:'en';}setLang(lang);})();
</script>
</body>
